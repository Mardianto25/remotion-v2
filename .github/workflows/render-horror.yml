name: Generate Ruang Cerita Indonesia Video

on:
  workflow_dispatch:
    inputs:
      topic_mode:
        description: "Pilih otomatis berdasarkan tren kemarin atau masukkan topik sendiri"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - manual
      topic:
        description: "Topik manual (hanya dipakai jika mode manual)"
        required: false
        default: ""
        type: string
      upload_to_youtube:
        description: "Upload otomatis video panjang ke channel Ruang Cerita Indonesia"
        required: true
        default: true
        type: boolean
      schedule_publish:
        description: "Jadwalkan tayang Jumat/Minggu pukul 19.00 WIB"
        required: true
        default: true
        type: boolean
      privacy_status:
        description: "Status jika penjadwalan dimatikan"
        required: true
        default: private
        type: choice
        options:
          - private
          - unlisted
          - public

permissions:
  contents: read

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: horror/package.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip
      - name: Install Node dependencies
        working-directory: horror
        run: npm install
      - name: Install Edge TTS
        run: python3 -m pip install --user --break-system-packages edge-tts
      - name: Generate story, audio, visuals, SEO and thumbnail
        working-directory: horror
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          EDGE_TTS_VOICE: id-ID-ArdiNeural
          EDGE_TTS_RATE: "-8%"
          EDGE_TTS_PITCH: "-5Hz"
          HORROR_TOPIC: ${{ inputs.topic }}
          HORROR_TOPIC_MODE: ${{ inputs.topic_mode }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_RC }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_RC }}
          YOUTUBE_REFRESH_TOKEN_V2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RC }}
        run: |
          if [ "$HORROR_TOPIC_MODE" = "auto" ]; then
            npm run generate -- --auto
          else
            if [ -z "$HORROR_TOPIC" ]; then echo "Topik wajib diisi pada mode manual."; exit 1; fi
            npm run generate -- "$HORROR_TOPIC"
          fi
      - name: Ensure Remotion browser
        working-directory: horror
        run: npx remotion browser ensure
      - name: Render long video
        working-directory: horror
        run: npm run render
      - name: Save long video and source assets for separate Shorts workflow
        uses: actions/upload-artifact@v4
        with:
          name: ruang-cerita-indonesia-assets
          path: |
            horror/out/indonesian-horror.mp4
            horror/out/youtube-thumbnail.jpg
            horror/data/story.json
            horror/data/youtube-metadata.json
            horror/data/asset-manifest.json
            horror/data/trend-report.json
            horror/public/audio/narration.mp3
            horror/public/audio/narration.vtt
            horror/remotion/generatedStory.js
          if-no-files-found: error
          retention-days: 7

  upload-to-youtube:
    if: ${{ inputs.upload_to_youtube }}
    needs: generate-and-render
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download generated long video
        uses: actions/download-artifact@v4
        with:
          name: ruang-cerita-indonesia-assets
          path: horror
      - name: Install Node dependencies
        working-directory: horror
        run: npm install
      - name: Validate channel and upload existing long video
        working-directory: horror
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_RC }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_RC }}
          YOUTUBE_REFRESH_TOKEN_V2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_RC }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy_status }}
          YOUTUBE_SCHEDULE_ENABLED: ${{ inputs.schedule_publish }}
        run: npm run upload:youtube
      - name: Preserve upload state for retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruang-cerita-indonesia-upload-state
          path: horror/data/youtube-upload-state.json
          if-no-files-found: ignore
          retention-days: 7
