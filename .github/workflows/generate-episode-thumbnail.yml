name: Ruang Cerita — Generate Episode Thumbnail
on:
  workflow_dispatch:
    inputs:
      season_id:
        description: Season ID
        required: true
        default: season-01
        type: string
      episode_number:
        description: Nomor episode
        required: true
        default: "1"
        type: choice
        options: ["1","2","3","4","5","6","7","8"]
permissions:
  contents: write
jobs:
  thumbnail:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate SEO metadata and thumbnail only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID_V2 }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN_V2 }}
          CF_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
        run: node scripts/episode-stage.js thumbnail --season "${{ inputs.season_id }}" --episode "${{ inputs.episode_number }}"
      - name: Persist thumbnail and metadata
        if: always()
        env:
          SEASON_ID: ${{ inputs.season_id }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: |
          EP=$(printf "%02d" "$EPISODE_NUMBER")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "data/seasons/$SEASON_ID/episodes/episode-$EP" "data/seasons/$SEASON_ID/production-state.json"
          git diff --cached --quiet || (git commit -m "chore(thumbnail): save $SEASON_ID episode $EP thumbnail" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: episode-thumbnail-${{ inputs.season_id }}-${{ inputs.episode_number }}
          path: |
            horror/data/seasons/${{ inputs.season_id }}/episodes/episode-${{ inputs.episode_number }}/youtube-thumbnail.jpg
            horror/data/seasons/${{ inputs.season_id }}/episodes/episode-${{ inputs.episode_number }}/shorts-cover.jpg
          retention-days: 30
