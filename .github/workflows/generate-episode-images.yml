name: 03 - Episode Images | Generate & Resume
on:
  workflow_dispatch:
    inputs:
      season_id:
        description: Season ID
        required: true
        default: season-01
        type: string
      episode_number:
        description: Nomor episode
        required: true
        default: "1"
        type: choice
        options: ["1","2","3","4","5","6","7","8"]
      visual_style:
        description: Visual style
        required: true
        default: cinematic-3d
        type: choice
        options: [cinematic-3d, 2d-animation]
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: horror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate missing scene images only
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID_V2 }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN_V2 }}
          CF_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
          STORY_GENRE: ${{ inputs.season_id }}
          HORROR_VISUAL_STYLE: ${{ inputs.visual_style }}
          HORROR_STRICT_VISUAL_STYLE: "true"
        run: |
          SEASON_DIR="data/seasons/${{ inputs.season_id }}"
          node -e 'const fs=require("fs"); const p=process.argv[1]; const b=JSON.parse(fs.readFileSync(p)); process.stdout.write(b.genre||"mystery")' "$SEASON_DIR/series-bible.json" > /tmp/story-genre
          export STORY_GENRE="$(cat /tmp/story-genre)"
          node scripts/episode-stage.js images --season "${{ inputs.season_id }}" --episode "${{ inputs.episode_number }}"
      - name: Persist successful images even when a later scene fails
        if: always()
        env:
          SEASON_ID: ${{ inputs.season_id }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: |
          EP=$(printf "%02d" "$EPISODE_NUMBER")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "data/seasons/$SEASON_ID/episodes/episode-$EP" "data/seasons/$SEASON_ID/production-state.json" || true
          git diff --cached --quiet || (git commit -m "chore(images): checkpoint $SEASON_ID episode $EP images" && git push)
