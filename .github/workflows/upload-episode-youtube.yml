name: 07 - Upload YouTube | PRIVATE
on:
  workflow_dispatch:
    inputs:
      season_id:
        description: Pilih ID serial yang sama dengan workflow sebelumnya
        required: true
        default: season-01
        type: choice
        options:
          - season-01
          - season-02
          - season-03
          - season-04
          - season-05
          - season-06
          - season-07
          - season-08
          - season-09
          - season-10
          - season-11
          - season-12
          - season-13
          - season-14
          - season-15
          - season-16
          - season-17
          - season-18
          - season-19
          - season-20
      episode_number:
        description: Nomor episode
        required: true
        default: "1"
        type: choice
        options: ["1","2","3","4","5","6","7","8"]
      render_run_id:
        description: GitHub Actions run ID dari workflow Render Episode Video
        required: true
        type: string
      thumbnail_run_id:
        description: GitHub Actions run ID dari workflow Generate Episode Thumbnail
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Download rendered video from selected run
        uses: actions/download-artifact@v4
        with:
          name: episode-video-${{ inputs.season_id }}-${{ inputs.episode_number }}
          run-id: ${{ inputs.render_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: horror/out
      - name: Download thumbnail from selected run
        uses: actions/download-artifact@v4
        with:
          name: episode-thumbnail-${{ inputs.season_id }}-${{ inputs.episode_number }}
          run-id: ${{ inputs.thumbnail_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/episode-thumbnail
      - name: Prepare episode metadata and thumbnail
        env:
          SEASON_ID: ${{ inputs.season_id }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: |
          EP=$(printf "%02d" "$EPISODE_NUMBER")
          DIR="data/seasons/$SEASON_ID/episodes/episode-$EP"
          mkdir -p out
          cp "/tmp/episode-thumbnail/$DIR/youtube-thumbnail.jpg" out/youtube-thumbnail.jpg 2>/dev/null || find /tmp/episode-thumbnail -name youtube-thumbnail.jpg -exec cp {} out/youtube-thumbnail.jpg \;
          cp "$DIR/youtube-metadata.json" data/youtube-metadata.json
      - name: Upload privately to the 3N channel
        env:
          YOUTUBE_CLIENT_ID_3N: ${{ secrets.YOUTUBE_CLIENT_ID_3N }}
          YOUTUBE_CLIENT_SECRET_3N: ${{ secrets.YOUTUBE_CLIENT_SECRET_3N }}
          YOUTUBE_REFRESH_TOKEN_3N: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3N }}
          YOUTUBE_CHANNEL_NAME: Ruang Cerita Indonesia
          SEASON_ID: ${{ inputs.season_id }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: |
          EP=$(printf "%02d" "$EPISODE_NUMBER")
          export EPISODE_UPLOAD_STATE="data/seasons/$SEASON_ID/episodes/episode-$EP/youtube-upload.json"
          node scripts/uploadEpisode.js
      - name: Update episode production state
        env:
          SEASON_ID: ${{ inputs.season_id }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: |
          EP=$(printf "%02d" "$EPISODE_NUMBER")
          node --input-type=module -e '
            import fs from "node:fs/promises";
            const dir = "data/seasons/" + process.env.SEASON_ID;
            const state = JSON.parse(await fs.readFile(dir + "/production-state.json", "utf8"));
            const upload = JSON.parse(await fs.readFile(dir + "/episodes/episode-" + String(process.env.EPISODE_NUMBER).padStart(2,"0") + "/youtube-upload.json", "utf8"));
            state.episodes = state.episodes.map(e => e.episodeNumber === Number(process.env.EPISODE_NUMBER) ? {...e, status:"uploaded", youtubeVideoId:upload.videoId, youtubeUrl:upload.url, youtubePrivacyStatus:upload.privacyStatus} : e);
            state.updatedAt = new Date().toISOString();
            await fs.writeFile(dir + "/production-state.json", JSON.stringify(state,null,2) + "\n");
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/seasons/$SEASON_ID/episodes/episode-$EP/youtube-upload.json" "data/seasons/$SEASON_ID/production-state.json"
          git diff --cached --quiet || (git commit -m "chore(youtube): record $SEASON_ID episode $EP upload" && git push)
