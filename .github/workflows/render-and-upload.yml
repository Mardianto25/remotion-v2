name: Render Remotion Shorts & Upload to YouTube

on:
  push:
    paths:
      - 'public/subtitles.json'
      - 'public/audio.mp3'
  workflow_dispatch:

# Jangan biarkan dua render/upload mengakses aset dan jadwal YouTube bersamaan.
concurrency:
  group: remotion-shorts-render-upload
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install Linux Browser Dependencies for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 ffmpeg


      - name: 4. Install Project Dependencies
        run: npm install

      - name: 5. Validasi Sinkronisasi Audio, Subtitle & Gambar
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const audio = 'public/audio.mp3';
          const subtitlesFile = 'public/subtitles.json';
          if (!fs.existsSync(audio)) throw new Error('public/audio.mp3 tidak ditemukan');
          if (!fs.existsSync(subtitlesFile)) throw new Error('public/subtitles.json tidak ditemukan');

          const duration = Number(execFileSync('ffprobe', [
            '-v', 'error', '-show_entries', 'format=duration',
            '-of', 'default=noprint_wrappers=1:nokey=1', audio
          ], { encoding: 'utf8' }).trim());
          if (!Number.isFinite(duration) || duration <= 0) {
            throw new Error('Durasi audio tidak dapat dibaca');
          }

          const scenes = JSON.parse(fs.readFileSync(subtitlesFile, 'utf8'));
          if (!Array.isArray(scenes) || scenes.length === 0) {
            throw new Error('subtitles.json kosong atau bukan array');
          }

          let previousStart = -1;
          let previousEnd = 0;
          for (let i = 0; i < scenes.length; i++) {
            const scene = scenes[i];
            const start = Number(scene.start);
            const end = Number(scene.end);
            if (!Number.isFinite(start) || !Number.isFinite(end) ||
                start < 0 || end <= start || !String(scene.text || '').trim()) {
              throw new Error('Timestamp/teks scene ' + (i + 1) + ' tidak valid');
            }
            if (start < previousStart || start < previousEnd - 0.02) {
              throw new Error('Urutan atau overlap timestamp bermasalah pada scene ' + (i + 1));
            }
            if (end > duration + 0.25) {
              throw new Error('Scene ' + (i + 1) + ' melewati durasi audio (' + duration.toFixed(2) + 's)');
            }
            if (!scene.image) throw new Error('Gambar scene ' + (i + 1) + ' kosong');
            if (!scene.image.startsWith('http') && !fs.existsSync('public/' + scene.image.replace(/^\/+/, ''))) {
              throw new Error('File gambar scene ' + (i + 1) + ' tidak ditemukan: ' + scene.image);
            }
            previousStart = start;
            previousEnd = end;
          }
          console.log('Validasi berhasil: ' + scenes.length + ' scene, audio ' + duration.toFixed(2) + ' detik.');
          NODE

      - name: 6. Render Video Shorts with Remotion
        run: npm run render

      - name: 7. Generate YouTube Shorts Thumbnail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
          THUMBNAIL_SOURCE: auto
        run: npm run generate:thumbnail

      - name: 8. Generate Metadata & Upload to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_3N }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_3N }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3N }}
        run: npm run upload

      - name: 9. Siapkan Paket Template CapCut Android
        run: npm run export:capcut

      - name: 10. Simpan Video dan Paket CapCut sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-shorts-and-capcut-package
          path: |
            out/video.mp4
            out/capcut-template.zip
          retention-days: 7
