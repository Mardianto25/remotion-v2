name: Render Remotion Shorts & Upload to YouTube

on:
  push:
    paths:
      - 'public/subtitles.json'
      - 'public/audio.mp3'
  workflow_dispatch:

jobs:
  render-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install Linux Browser Dependencies for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 ffmpeg


      - name: 4. Install Project Dependencies
        run: npm install

      - name: 5. Render Video Shorts with Remotion
        run: npm run render

      # - name: 6. Generate YouTube Shorts Thumbnail
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     GEMINI_MODEL: gemini-3.5-flash-lite
      #     GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      #     THUMBNAIL_SOURCE: auto
      #   run: npm run generate:thumbnail

      - name: 6. Generate Metadata & Upload to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm run upload

      - name: 7. Simpan Video Hasil Render sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-shorts-video
          path: out/video.mp4
          retention-days: 3
