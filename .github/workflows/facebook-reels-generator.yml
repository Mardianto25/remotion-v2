name: Generate and Publish Independent Facebook Reels

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema renungan Islami untuk video baru"
        required: true
        type: string
        default: "Ketika doa terasa belum dijawab"
      publish:
        description: "Jadwalkan Reels ke Facebook Page setelah render"
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

concurrency:
  group: independent-facebook-reels
  cancel-in-progress: false

jobs:
  generate-render-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Restore persistent character master
        uses: actions/cache@v4
        with:
          path: public/facebook-reels/character-master.png
          key: facebook-reels-character-master-v1

      - name: Install FFmpeg and Remotion browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install project dependencies
        run: npm install

      - name: Generate original Islamic reflection script
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          REELS_TOPIC: \${{ inputs.topic }}
        run: node facebook-reels/scripts/generate-content.js

      - name: Generate emotional male narration with Gemini TTS
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODELS: gemini-3.8-flash-tts,gemini-2.5-flash-preview-tts
        run: node facebook-reels/scripts/generate-voice.js

      - name: Generate consistent cinematic 3D scenes
        env:
          CF_ACCOUNT_ID: \${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: \${{ secrets.CF_API_TOKEN }}
        run: node facebook-reels/scripts/generate-scenes.js

      - name: Generate Facebook distribution metadata
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
        run: node facebook-reels/scripts/generate-metadata.js

      - name: Render independent Facebook Reels video
        run: |
          mkdir -p out/facebook-reels
          npx remotion render facebook-reels/remotion/index.jsx FacebookReels out/facebook-reels/reel.mp4 --codec h264

      - name: Validate rendered video
        run: |
          test -s out/facebook-reels/reel.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/facebook-reels/reel.mp4)
          echo "Rendered duration: $DURATION seconds"
          awk -v d="$DURATION" 'BEGIN { if (d < 25 || d > 50) exit 1 }'

      - name: Publish Reels to Facebook Page
        if: \${{ inputs.publish }}
        env:
          FB_PAGE_ID: \${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: \${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: v27.0
        run: node facebook-reels/scripts/upload-reels.js

      - name: Save generated video and personal profile caption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-facebook-reels
          path: |
            out/facebook-reels/
            public/facebook-reels/audio.wav
            public/facebook-reels/subtitles.json
            public/facebook-reels/character-master.png
            public/facebook-reels/images/
          if-no-files-found: warn
          retention-days: 14
