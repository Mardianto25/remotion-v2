name: Generate and Publish Independent Facebook Reels

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topik renungan Islami (kosong = dipilih otomatis)
        required: false
        type: string
        default: "Renungan Islami tentang doa yang belum terkabul"

permissions:
  contents: read

concurrency:
  group: independent-facebook-reels
  cancel-in-progress: false

jobs:
  generate-render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore recurring character master
        uses: actions/cache@v4
        with:
          path: facebook-reels/assets/character-master.png
          key: facebook-reels-character-master-v1

      - name: Install dependencies
        run: npm ci

      - name: Generate original Islamic reflection script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONTENT_MODEL: gemini-2.5-flash
          REELS_TOPIC: ${{ inputs.topic }}
        run: node facebook-reels/generate-content.js

      - name: Generate emotional Indonesian male narration with Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-2.5-flash-preview-tts
          GEMINI_TTS_VOICE: Algenib
        run: node facebook-reels/generate-audio.js

      - name: Generate consistent 3D cinematic scenes
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node facebook-reels/generate-scenes.js

      - name: Render standalone Facebook Reel
        run: |
          mkdir -p out/facebook-reels
          npx remotion render facebook-reels/src/index.jsx FacebookReel out/facebook-reels/video.mp4 --public-dir=out/facebook-reels/public --codec=h264

      - name: Validate rendered Reel
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          const video = 'out/facebook-reels/video.mp4';
          if (!fs.existsSync(video) || fs.statSync(video).size === 0) throw new Error('Video hasil render tidak ditemukan.');
          const duration = Number(execFileSync('ffprobe', ['-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',video], {encoding:'utf8'}).trim());
          if (!Number.isFinite(duration) || duration < 25 || duration > 50) throw new Error('Durasi video di luar rentang Reels: ' + duration);
          console.log('Video siap:', duration.toFixed(2), 'detik');
          NODE

      - name: Generate Facebook Reels metadata
        run: node facebook-reels/generate-metadata.js

      - name: Publish to Facebook Page Reels only
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: v27.0
        run: node facebook-reels/upload-reel.js

      - name: Save generated Reel package
        uses: actions/upload-artifact@v4
        with:
          name: independent-facebook-reel
          path: |
            out/facebook-reels/video.mp4
            out/facebook-reels/content.json
            out/facebook-reels/facebook-metadata.json
            out/facebook-reels/transcript.txt
          retention-days: 14
