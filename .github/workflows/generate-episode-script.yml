name: 02 - Episode Script | Ambil Naskah Tanpa AI
on:
  workflow_dispatch:
    inputs:
      season_id:
        description: Pilih ID serial yang sama dengan workflow sebelumnya
        required: true
        default: season-01
        type: choice
        options:
          - season-01
          - season-02
          - season-03
          - season-04
          - season-05
          - season-06
          - season-07
          - season-08
          - season-09
          - season-10
          - season-11
          - season-12
          - season-13
          - season-14
          - season-15
          - season-16
          - season-17
          - season-18
          - season-19
          - season-20
      episode_number:
        description: Nomor episode
        required: true
        default: "1"
        type: choice
        options: ["1","2","3","4","5","6","7","8"]
permissions:
  contents: write
jobs:
  script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Materialize pre-generated episode script (NO AI CALL)
        run: node scripts/series.js episode --season "${{ inputs.season_id }}" --episode "${{ inputs.episode_number }}"
      - name: Persist episode script
        env:
          SEASON_ID: ${{ inputs.season_id }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
        run: |
          EP=$(printf "%02d" "$EPISODE_NUMBER")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/seasons/$SEASON_ID/episodes/episode-$EP/story.json" "data/seasons/$SEASON_ID/production-state.json" "data/story.json" "data/active-episode.json"
          git diff --cached --quiet || (git commit -m "chore(series): materialize $SEASON_ID episode $EP script" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: episode-script-${{ inputs.season_id }}-${{ inputs.episode_number }}
          path: |
            horror/data/seasons/${{ inputs.season_id }}/episodes/episode-${{ inputs.episode_number }}/story.json
          retention-days: 30
