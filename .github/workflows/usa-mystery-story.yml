name: USA Mystery - Generate Story

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Story topic (English)"
        required: true
        default: "The Last Train Had One Extra Passenger"
        type: string

permissions:
  contents: read

jobs:
  generate-story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: usa-mystery
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: usa-mystery/package.json
      - name: Install dependencies
        run: npm install
      - name: Generate English story package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.USA_GEMINI_MODEL || 'gemini-2.5-flash' }}
          USA_STORY_DURATION_SECONDS: "55"
        run: npm run generate:story -- "${{ inputs.topic }}"
      - name: Upload story artifact
        uses: actions/upload-artifact@v4
        with:
          name: usa-mystery-story
          path: usa-mystery/data/story.json
          if-no-files-found: error
          retention-days: 7
