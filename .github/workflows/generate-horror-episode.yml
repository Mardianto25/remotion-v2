name: 99 - LEGACY | Season Planner (gunakan workflow 01)
on:
  workflow_dispatch:
    inputs:
      season_id:
        description: ID season, contoh season-01
        required: true
        default: season-01
        type: string
      concept:
        description: Konsep serial
        required: true
        type: string
      force_regenerate:
        description: Ganti season plan lama yang belum memiliki episode produksi
        required: true
        default: false
        type: boolean
      genre:
        description: Genre serial
        required: true
        default: mystery
        type: choice
        options: [mystery, horror, islamic, inspirational, drama, history, adventure, fantasy, education]
permissions:
  contents: write
jobs:
  create-season:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Create complete season plan (all 8 scripts and scene prompts)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
      OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS || 'qwen/qwen3-235b-a22b-2507,deepseek/deepseek-v3.2' }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          FORCE=""
          if [ "${{ inputs.force_regenerate }}" = "true" ]; then FORCE="--force"; fi
          node scripts/series.js plan --season "${{ inputs.season_id }}" --genre "${{ inputs.genre }}" --concept "${{ inputs.concept }}" $FORCE
      - name: Persist season plan
        env:
          SEASON_ID: ${{ inputs.season_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/seasons/$SEASON_ID"
          git diff --cached --quiet || (git commit -m "chore(series): save complete $SEASON_ID plan" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: ruang-cerita-${{ inputs.season_id }}-season-plan
          path: horror/data/seasons/${{ inputs.season_id }}/
          retention-days: 30
