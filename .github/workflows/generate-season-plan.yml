name: 01 - Season Plan | Tema, Naskah & Semua Scene
on:
  workflow_dispatch:
    inputs:
      season_id:
        description: Pilih ID serial yang sama dengan workflow sebelumnya
        required: true
        default: season-01
        type: choice
        options:
          - season-01
          - season-02
          - season-03
          - season-04
          - season-05
          - season-06
          - season-07
          - season-08
          - season-09
          - season-10
          - season-11
          - season-12
          - season-13
          - season-14
          - season-15
          - season-16
          - season-17
          - season-18
          - season-19
          - season-20
      episode_count:
        description: Tentukan panjang alur cerita serial
        required: true
        default: "8"
        type: choice
        options: ["4", "6", "8", "10", "12"]
      series_title:
        description: Judul serial yang akan digunakan
        required: true
        type: string
      concept:
        description: Pilih konsep cerita serial
        required: true
        type: choice
        options:
          - Misteri sebuah desa yang menyimpan rahasia turun-temurun
          - Rumah tua dengan rahasia kelam keluarga
          - Perjalanan seseorang memperbaiki diri dan mencari ampunan
          - Kisah perjuangan keluarga menghadapi masalah ekonomi
          - Persahabatan dan pengkhianatan yang mengubah hidup
          - Legenda dan sejarah lokal yang penuh teka-teki
          - Petualangan mencari benda atau tempat yang hilang
          - Dunia fantasi dengan aturan dan kekuatan unik
          - Kisah inspiratif tentang perjuangan meraih cita-cita
          - Edukasi kehidupan melalui cerita dengan konflik nyata
      force_regenerate:
        description: Ganti season plan lama yang belum memiliki episode produksi
        required: true
        default: false
        type: boolean
      genre:
        description: Genre serial
        required: true
        default: mystery
        type: choice
        options: [mystery, horror, islamic, inspirational, drama, history, adventure, fantasy, education]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate complete season bible, scripts and scenes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          FORCE=""
          if [ "${{ inputs.force_regenerate }}" = "true" ]; then FORCE="--force"; fi
          node scripts/series.js plan --season "${{ inputs.season_id }}" --episodes "${{ inputs.episode_count }}" --genre "${{ inputs.genre }}" --title "${{ inputs.series_title }}" --concept "${{ inputs.concept }}" $FORCE
      - name: Persist season plan
        env:
          SEASON_ID: ${{ inputs.season_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/seasons/$SEASON_ID"
          git diff --cached --quiet || (git commit -m "chore(series): save complete $SEASON_ID plan" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: season-plan-${{ inputs.season_id }}
          path: horror/data/seasons/${{ inputs.season_id }}/
          retention-days: 30
