name: 01 - SHORT | Season Plan
on:
  workflow_dispatch:
    inputs:
      episode_count:
        description: Tentukan panjang alur cerita serial
        required: true
        default: "8"
        type: choice
        options: ["4", "6", "8", "10", "12"]
      series_title:
        description: Judul serial yang akan digunakan
        required: true
        type: string
      concept:
        description: Pilih konsep cerita serial
        required: true
        type: choice
        options:
          - Misteri sebuah desa yang menyimpan rahasia turun-temurun
          - Rumah tua dengan rahasia kelam keluarga
          - Perjalanan seseorang memperbaiki diri dan mencari ampunan
          - Kisah perjuangan keluarga menghadapi masalah ekonomi
          - Persahabatan dan pengkhianatan yang mengubah hidup
          - Legenda dan sejarah lokal yang penuh teka-teki
          - Petualangan mencari benda atau tempat yang hilang
          - Dunia fantasi dengan aturan dan kekuatan unik
          - Kisah inspiratif tentang perjuangan meraih cita-cita
          - Edukasi kehidupan melalui cerita dengan konflik nyata
      force_regenerate:
        description: Ganti season plan lama yang belum memiliki episode produksi
        required: true
        default: false
        type: boolean
      genre:
        description: Genre serial
        required: true
        default: mystery
        type: choice
        options: [mystery, horror, islamic, inspirational, drama, history, adventure, fantasy, education]
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horror
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve Series ID from title
        id: resolve-series
        env:
          SERIES_TITLE: ${{ inputs.series_title }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const title = (process.env.SERIES_TITLE || '').trim();
          const slug = title.normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '')
            .slice(0, 80)
            .replace(/-+$/g, '');
          if (!slug) throw new Error('Judul serial tidak valid untuk dibuat menjadi Series ID.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'season_id=short-' + slug + '\n');
          NODE
      - run: npm install
      - name: Generate complete season bible, scripts and scenes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS || 'qwen/qwen3-235b-a22b-2507,deepseek/deepseek-v3.2' }}
          OPENROUTER_EPISODE_BATCH_SIZE: ${{ vars.OPENROUTER_EPISODE_BATCH_SIZE || '2' }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODELS: gemini-3.5-flash,gemini-2.5-flash
        run: |
          FORCE=""
          if [ "${{ inputs.force_regenerate }}" = "true" ]; then FORCE="--force"; fi
          node scripts/series.js plan --season "${{ steps.resolve-series.outputs.season_id }}" --episodes "${{ inputs.episode_count }}" --genre "${{ inputs.genre }}" --title "${{ inputs.series_title }}" --concept "${{ inputs.concept }}" $FORCE
      - name: Refresh plan and episode dropdowns
        run: node scripts/sync-workflow-options.js
      - name: Persist season plan
        env:
          SEASON_ID: ${{ steps.resolve-series.outputs.season_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/seasons/$SEASON_ID" ../.github/workflows/generate-episode-script.yml ../.github/workflows/generate-episode-images.yml ../.github/workflows/generate-episode-audio.yml ../.github/workflows/render-episode-video.yml ../.github/workflows/generate-episode-thumbnail.yml ../.github/workflows/upload-episode-youtube.yml
          git diff --cached --quiet || (git commit -m "chore(series): save complete $SEASON_ID plan" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: season-plan-${{ steps.resolve-series.outputs.season_id }}
          path: horror/data/seasons/${{ steps.resolve-series.outputs.season_id }}/
          retention-days: 30
