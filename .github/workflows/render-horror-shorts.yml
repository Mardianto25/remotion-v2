name: Generate and Upload Shorts - Ruang Cerita Indonesia

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID workflow video panjang yang ingin dijadikan Shorts"
        required: true
        type: string
      privacy_status:
        description: "Status publikasi Shorts"
        required: true
        default: public
        type: choice
        options:
          - public
          - unlisted
          - private

permissions:
  actions: read
  contents: read

jobs:
  generate-and-upload-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: horror/package.json
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download long-video artifact from selected run
        uses: actions/download-artifact@v4
        with:
          name: ruang-cerita-indonesia-assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: horror
      - name: Install Node dependencies
        working-directory: horror
        run: npm install
      - name: Generate vertical Shorts and SEO metadata
        working-directory: horror
        run: npm run generate:shorts
      - name: Upload Shorts to Ruang Cerita Indonesia
        working-directory: horror
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_V2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_V2 }}
          YOUTUBE_SHORTS_PRIVACY_STATUS: ${{ inputs.privacy_status }}
        run: npm run upload:shorts
      - name: Preserve generated Shorts and upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruang-cerita-indonesia-shorts
          path: |
            horror/out/shorts/*.mp4
            horror/data/shorts-manifest.json
            horror/data/shorts-metadata.json
            horror/data/shorts-upload-state.json
          if-no-files-found: ignore
          retention-days: 7
