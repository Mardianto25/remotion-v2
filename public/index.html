<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Shorts Studio (Termux)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 500px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; color: #38bdf8; }
    .tab { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab button { flex: 1; padding: 8px; background: #334155; color: #94a3b8; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab button.active { background: #0284c7; color: white; }
    .form-section { display: none; }
    .form-section.active { display: block; }
    input[type="file"], input[type="url"] { width: 100%; margin: 15px 0; padding: 10px; background: #334155; border-radius: 8px; border: 1px solid #475569; color: #fff; box-sizing: border-box; }
    label { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 14px; color: #cbd5e1; }
    button.submit-btn { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    button.submit-btn:disabled { background: #475569; }
    pre { background: #090d16; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; color: #a7f3d0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎬 Auto-Shorts Studio</h2>
    <p style="font-size: 14px; color: #94a3b8;">Ubah berkas audio atau tautan Instagram Reels menjadi video Shorts otomatis.</p>
    
    <!-- Tab Navigasi Pilihan Input -->
    <div class="tab">
      <button id="tabFileBtn" class="active" onclick="switchTab('file')">Unggah File Audio</button>
      <button id="tabIgBtn" onclick="switchTab('ig')">Link Instagram</button>
    </div>

    <!-- Form 1: Upload File Audio -->
    <form id="uploadForm" class="form-section active">
      <input type="file" id="audioFile" accept="audio/*" required />
      <label>
        <input type="checkbox" id="autoPushFile" checked />
        Otomatis Git Push (Trigger GitHub Actions)
      </label>
      <button type="submit" class="submit-btn" id="submitFileBtn">Proses File Audio</button>
    </form>

    <!-- Form 2: Input Link Instagram -->
    <form id="igForm" class="form-section">
      <input type="url" id="igUrl" placeholder="https://www.instagram.com/reel/..." required />
      <label>
        <input type="checkbox" id="autoPushIg" checked />
        Otomatis Git Push (Trigger GitHub Actions)
      </label>
      <button type="submit" class="submit-btn" id="submitIgBtn">Ambil Audio & Buat Video</button>
    </form>

    <div id="output" style="margin-top: 20px; display: none;">
      <h4>Status Pemrosesan:</h4>
      <pre id="resultLog"></pre>
    </div>
  </div>

  <script>
    function switchTab(type) {
      document.getElementById('uploadForm').classList.toggle('active', type === 'file');
      document.getElementById('igForm').classList.toggle('active', type === 'ig');
      document.getElementById('tabFileBtn').classList.toggle('active', type === 'file');
      document.getElementById('tabIgBtn').classList.toggle('active', type === 'ig');
    }

    const output = document.getElementById('output');
    const resultLog = document.getElementById('resultLog');

    // Handler Form File Audio Manual
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('audioFile');
      if (!fileInput.files[0]) return;

      const btn = document.getElementById('submitFileBtn');
      btn.disabled = true;
      btn.textContent = 'Memproses Audio...';
      output.style.display = 'block';
      resultLog.textContent = 'Mengunggah file audio dan menganalisis lewat Gemini AI...';

      const formData = new FormData();
      formData.append('audio', fileInput.files[0]);
      formData.append('autoPush', document.getElementById('autoPushFile').checked);

      try {
        const res = await fetch('/api/upload-audio', { method: 'POST', body: formData });
        const data = await res.json();
        resultLog.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultLog.textContent = 'Gagal: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Proses File Audio';
      }
    });

    // Handler Form Link Instagram (Mengirim parameter ke /api/process-ig-url)
    document.getElementById('igForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const igUrl = document.getElementById('igUrl').value.trim();
      if (!igUrl) return;

      const btn = document.getElementById('submitIgBtn');
      btn.disabled = true;
      btn.textContent = 'Mengunduh Audio Instagram...';
      output.style.display = 'block';
      resultLog.textContent = 'Menarik audio dari link Instagram via yt-dlp dan memproses pipeline AI...';

      try {
        const res = await fetch('/api/process-ig-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            igUrl: igUrl,
            autoPush: document.getElementById('autoPushIg').checked
          })
        });
        const data = await res.json();
        resultLog.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultLog.textContent = 'Gagal: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ambil Audio & Buat Video';
      }
    });
  </script>
</body>
</html>
