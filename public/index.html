<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Shorts Studio (Termux)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 500px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; color: #38bdf8; }
    input[type="file"] { width: 100%; margin: 15px 0; padding: 10px; background: #334155; border-radius: 8px; border: 1px solid #475569; color: #fff; box-sizing: border-box; }
    label { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 14px; color: #cbd5e1; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:disabled { background: #475569; }
    pre { background: #090d16; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; color: #a7f3d0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎬 Auto-Shorts Studio</h2>
    <p style="font-size: 14px; color: #94a3b8;">Unggah rekaman suara untuk dianalisis AI, dipasangkan dengan visual alam Pixabay, dan dirender via GitHub Actions.</p>
    <form id="uploadForm">
      <input type="file" id="audioFile" accept="audio/*" required />
      <label>
        <input type="checkbox" id="autoPush" checked />
        Otomatis Git Commit & Push (Trigger Render GitHub Actions)
      </label>
      <button type="submit" id="submitBtn">Proses & Buat Video</button>
    </form>
    <div id="output" style="margin-top: 20px; display: none;">
      <h4>Status Pemrosesan:</h4>
      <pre id="resultLog"></pre>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const btn = document.getElementById('submitBtn');
    const output = document.getElementById('output');
    const resultLog = document.getElementById('resultLog');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('audioFile');
      if (!fileInput.files[0]) return;

      btn.disabled = true;
      btn.textContent = 'Memproses Audio & AI...';
      output.style.display = 'block';
      resultLog.textContent = 'Mengunggah audio ke server dan menganalisis lewat Gemini AI...';

      const formData = new FormData();
      formData.append('audio', fileInput.files[0]);
      formData.append('autoPush', document.getElementById('autoPush').checked);

      try {
        const res = await fetch('/api/upload-audio', { method: 'POST', body: formData });
        const data = await res.json();
        resultLog.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultLog.textContent = 'Gagal: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Proses & Buat Video';
      }
    });
  </script>
</body>
</html>
